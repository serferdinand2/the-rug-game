	box-sizing: border-box;

.rg-card-frame img {
	image-rendering: pixelated;

.rg-card-frame [tabindex='0']:focus-visible {
	outline: 2px solid var(--player-1);
	outline-offset: 2px;
}

	.rg-card-frame.svelte-t23jar .rg-card-frame--band {
		min-height: 49px;
		padding: var(--space-4) var(--space-6);
	}
	.rg-card-frame--body.svelte-t23jar {
		display: grid;
		grid-template-columns: 160px 1fr;
		align-items: start;
		gap: 12px;
		padding: 12px;
	}
	/* The wide stage: the picture across the card, cropped to a band round its middle, with the overlay on it. */

		grid-template-columns: 1fr;
	}
	.rg-card-frame--stage.svelte-t23jar {

		width: 100%;

/* Design tokens: the single source of truth for the interface's colours, texture, type, spacing, borders, shadows and motion, taken from the phase-one designs in docs/ui/. */
:root {
	color-scheme: dark;

	/* ---------- Colour: surfaces, from darkest to lightest ---------- */
	--ink: #121517; /* page and grid backing, inputs, text on a filled colour */
	--chrome: #171a1d; /* header, footer, panels, player overview */
	--control: #202529; /* buttons, chips, cards, list rows */
	--surface: #242a2e; /* the middle play area, under the pixel texture */
	--raised: #30383c; /* hovered controls, selected tabs and rows */

	/* ---------- Colour: lines ---------- */
	--line-soft: #3d4549; /* panel borders and dividers */
	--line: #465257; /* rules, separators, input borders, empty plots */
	--line-strong: #596166; /* small-button borders, empty-seat outlines */

	/* ---------- Colour: text ---------- */
	--text: #e8ddc4;
	--muted: #b9af9b;
	--faint: #737d81; /* inactive tabs, selectors and icons */
	--over-picture: #e8ddc4; /* lines drawn over a picture, which a card's own palette must not darken: the Islanders' mat (#165) */

	/* ---------- Colour: accents and states ---------- */
	--gold: #e2b857; /* selection, proper names, civilization names */
	--bronze: #b88746; /* district boundaries, eyebrows, neutral cost borders */
	--action: #79b99b; /* primary actions, the current player's glow */
	--ok: #8fd0aa; /* valid placement, confirmation, readiness, completed groups */
	--danger: #e05f5f; /* mute slash, impassable plots, remove controls */

	/* ---------- Colour: tracks ---------- */
	--exploration: #3f83a8;
	--science: #579274;
	--technology: #b57a3b;
	--military: #a94f4f;
	--arts: #7b5aa6; /* Arts & Architecture's arts track: violet, as its brush symbol (owner, #35 part 4) */

	/* ---------- Colour: Arts & Architecture's pieces (#35 part 4) ---------- */
	--masterpiece-back: #5f3a9e; /* a masterpiece face down: the deck's back, a used card */
	--masterpiece-back-deep: #3a2463; /* the far end of the back's gradient */
	--masterpiece-used: #4b3a5e; /* a used single-use masterpiece's chip */
	--masterpiece-used-text: #d9cbe8;
	--masterpiece-used-note: #b9a7cf; /* its "used" */
	--inspiration-tile: #4b2f7c; /* an inspiration tile not yet placed */
	--inspiration-tile-text: #f3e6c4;

	/* ---------- Colour: players, by seat; kept apart from the track colours, and from each other for colour-blind players ---------- */
	--player-1: #4ea1d3;
	--player-2: #e06a55;
	--player-3: #64ae67;

	/* ---------- Type: families and weights ---------- */
	--font-title:
		'Cinzel', serif; /* names of game things: tracks, spaces, civilizations, landmarks, terrain */
	--font-body:
		'Atkinson Hyperlegible', sans-serif; /* player names, instructions, controls, data */
	--weight-regular: 400;
	--weight-title: 600;
	--weight-bold: 700;

	/* ---------- Type: sizes ---------- */
	--font-size-3xs: 10px; /* the smallest text anywhere: badges, tags, cost labels, space numbers, landmark names on spaces */
	--font-size-income-name-fit: clamp(
		9px,
		9px,
		var(--font-size-3xs)
	); /* a compact fixed fit for the Symbology income-space title */
	--font-size-income-mat-fit: clamp(5px, 14.5cqi, var(--font-size-3xs));
	--font-size-2xs: 11px; /* tier prices, small caps headings */
	--font-size-xs: 12px; /* hints, compact rows, small buttons */
	--font-size-sm: 13px; /* tabs, secondary text, options */
	--font-size-md: 14px; /* field labels, seat civilizations, Take the seat! */
	--font-size-base: 15px; /* body text and buttons */
	--font-size-lg: 16px; /* civilization names, panel headings */
	--font-size-xl: 18px; /* panel titles, the turn label */
	--font-size-2xl: 20px; /* the brand, player names in the overview */
	--font-size-3xl: 22px; /* page headings, the table code */
	--font-size-4xl: 25px; /* a player's score in the final standings */
	--font-size-5xl: 28px; /* a player's place in the final standings, a civilization card's title */
	--font-size-card-title-sm: 21px; /* the tapestry and landmark cards' titles (#109) */
	--font-scale-art-fan-title: 0.9; /* launch and lobby card titles are 10% smaller than playable card titles */
	--font-size-card-die: 23px; /* the × on the Alchemists' die faces (#106) */
	--font-size-6xl: 42px; /* a hero name: the pass screen's player, your place on the results */
	--font-size-display-sm: clamp(20px, 2vw, 26px); /* the lobby invitation */
	--font-size-display: clamp(24px, 3vw, 38px); /* the launch headline */
	--font-size-display-lg: clamp(
		32px,
		3vw,
		48px
	); /* the results title, Final standings */

	/* ---------- Type: line height and letter spacing ---------- */
	--leading-none: 1;
	--leading-tight: 1.1;
	--leading-snug: 1.25;
	--leading-normal: 1.4;
	--letter-spacing-button: 0.025em;
	--letter-spacing-title: 0.035em; /* Cinzel names and headings */
	--letter-spacing-caps: 0.08em; /* small uppercase badges and labels */
	--letter-spacing-wide: 0.11em; /* uppercase banners such as CLOSE THE PLAYERS OVERVIEW */

	/* ---------- Spacing ---------- */
	--space-1: 2px;
	--space-2: 4px;
	--space-3: 6px;
	--space-4: 8px;
	--space-5: 10px;
	--space-6: 12px;
	--space-7: 14px;
	--space-8: 16px;
	--space-9: 20px;
	--space-10: 24px;
	--space-11: 28px;

	/* ---------- Layout ---------- */
	--canvas-width: 1920px; /* the desktop reference size */
	--canvas-height: 1080px;
	--bar-height: 58px; /* header and footer */
	--play-columns: minmax(0, 3fr) minmax(0, 1fr); /* shared area, player area */
	--play-gap: 2px;
	--launch-width: 530px;
	--lobby-width: 1000px;
	--control-size: 36px; /* square icon buttons */
	--input-height: 44px;
	--input-height-small: 30px;
	--seat-height: 112px; /* lobby seats, filled or empty */
	--track-tip: 16px; /* the arrow tip of a track space and the inlet of the next one */
	--progress-line: 3px; /* tier price lines */
	--track-token: 28px; /* a player's token on the bottom edge of the track space it reached (#174) */
	--track-token-gap: 22px; /* between the tokens that share a track space, centre to centre (#174) */
	--track-hover-line: 6px; /* the viewer's glowing progress line while a track is hovered (#174 follow-up) */
	--capital-ground: saturate(0.7) brightness(0.78) contrast(0.82); /* the capital's ground recedes, so its pieces stand out (#174) */
	--capital-relief: saturate(0.7) brightness(0.85); /* the capital's impassable relief, likewise (#174) */
	--track-heading: 18px; /* a track's row with its symbol, which TrackBoard adds up as chrome */
	--track-prices: 18px; /* a track's row of tier prices */
	--track-bar-mix: 18%; /* how much of its track's colour tints a bar about a track: a decision's actions, the optional footer (#117) */
	--track-bar-band: 3px; /* the band of the track's colour along the bottom of such a bar (#117) */
	--docked-panel-width: 340px; /* a decision panel docked beside the World Map (#74) */
	--narrow-panel-width: 440px; /* a narrow decision panel: a pick of several things (#75), the first-income notice (#77) */
	/* A docked panel's distance from the shared area's right edge: the area's right padding, so the panel ends where the map would. */
	--docked-panel-inset: var(--space-9);

	/* ---------- Borders and corners ---------- */
	--border: 1px;
	--border-thick: 2px;
	--radius: 0;

	/* ---------- Scrims, floating surfaces and the disabled look (#97) ---------- */
	/* Over the board, under a prompt or a modeless dialog; under a modal dialog. */
	--scrim: color-mix(in srgb, var(--ink) 52%, transparent);
	--scrim-strong: color-mix(in srgb, var(--ink) 70%, transparent);
	/* The whole background of the decision panel and the dice tray. */
	--float-surface:
		linear-gradient(
			color-mix(in srgb, var(--ink) 60%, transparent),
			color-mix(in srgb, var(--ink) 60%, transparent)
		),
		var(--texture) var(--chrome);
	--opacity-disabled: 0.5;

	/* ---------- A prompt's choices: at rest, chosen, unpickable, and the "+N VP" tag (#116) ---------- */
	--choice-fill: color-mix(in srgb, var(--raised) 70%, transparent);
	--picked-fill: color-mix(in srgb, var(--gold) 17%, var(--surface));
	/* A choice that can't be picked now: dimmer than a disabled control. */
	--opacity-unpickable: 0.35;
	--vp-tag: var(--gold);
	--vp-tag-text: var(--ink);

	/* ---------- Shadows and glows (ordinary panels have none) ---------- */
	--shadow-float: 0 8px 24px rgb(0 0 0 / 53%); /* menus and dragged pieces */
	--shadow-card: 0 12px 28px rgb(0 0 0 / 27%); /* player overview cards */
	--glow-current:
		0 0 0 1px color-mix(in srgb, var(--action) 67%, transparent),
		0 0 8px color-mix(in srgb, var(--action) 80%, transparent),
		0 0 17px color-mix(in srgb, var(--action) 47%, transparent);
	/* The current player's glow while their End turn counts down (#177): the same green, dimmed, as the turn is passing. */
	--glow-closing:
		0 0 0 1px color-mix(in srgb, var(--action) 33%, transparent),
		0 0 6px color-mix(in srgb, var(--action) 30%, transparent);
	--glow-gold:
		0 0 5px color-mix(in srgb, var(--gold) 73%, transparent),
		0 0 12px color-mix(in srgb, var(--gold) 33%, transparent);
	--glow-gold-strong:
		0 0 0 1px color-mix(in srgb, var(--gold) 53%, transparent),
		0 0 14px color-mix(in srgb, var(--gold) 60%, transparent),
		0 0 28px color-mix(in srgb, var(--gold) 33%, transparent);
	--glow-ok: 0 0 10px color-mix(in srgb, var(--ok) 33%, transparent);
	--glow-ok-strong: 0 0 16px color-mix(in srgb, var(--ok) 67%, transparent);
	--glow-danger: 0 0 5px color-mix(in srgb, var(--danger) 53%, transparent);
	--text-glow-gold: 0 0 7px color-mix(in srgb, var(--gold) 67%, transparent);
	/* The flat overlay over completed rows, columns and districts. */
	--overlay-ok: color-mix(in srgb, var(--ok) 33%, transparent);

	/* ---------- Focus ---------- */
	--focus-outline: var(--border-thick) solid var(--gold);
	--focus-offset: 2px;

	/* ---------- Motion ---------- */
	--duration-fast: 150ms; /* hover and colour changes */
	--duration-medium: 220ms; /* reveals */
	--duration-slow: 380ms; /* header chips filling with colour */
	--duration-exit: 140ms; /* leaving: a menu closing, faster than anything comes in (#175) */
	--duration-focal: 600ms; /* the one authored moment: a token's hops, the winner's entrance (#175) */
	--ease: ease;
	--ease-out: cubic-bezier(0.2, 0.75, 0.25, 1);
	--ease-in: cubic-bezier(0.5, 0, 0.75, 0); /* leaving, speeding up (#175) */

	/* ---------- Layers ---------- */
	--layer-bar: 4;
	--layer-popover: 20;
	--layer-tray: 30; /* the dice tray, above a decision panel (#61) */
	--layer-drag: 100;
	--layer-tooltip: 200; /* the tooltip, over everything, dragged pieces too (#137) */
}

@media (prefers-reduced-motion: reduce) {
	:root {
		--duration-fast: 0ms;
		--duration-medium: 0ms;
		--duration-slow: 0ms;
		--duration-exit: 0ms;
		--duration-focal: 0ms;
	}
}

/* Dark cards (#167, owner, 2026-11-02): the menu's Dark cards switch puts data-cards="dark" on the page, and the library on
   an example. Only the cards change: each card family's root takes this palette, so the board, the mats and the
   track tiles that borrow a card colour keep theirs. Walnut paper under cream text, a near-black band under the
   gold title, gold where the paper had brown, and every track and edition colour lifted to read on the dark. */
[data-cards='dark']
	:is(
		.rg-card-frame,
		.rg-tech-layout,
		.rg-tapestry-layout,
		.rg-landmark-card,
		.rg-masterpiece-card,
		.rg-masterpiece-chip,
		.rg-tech-deck-back,
		.rg-gallery-entry__frame,
		.rg-art-fan--card
	) {
	--card-selection-edge: var(--player-1);
	--card-text: #ece1c8;
	--card-strong-text: #f6ebd1;
	--card-die-number: #e0d6c3;
	--card-band-start: #130e08;
	--card-expansion: #bba2e2;
	--card-plans-ploys: #91c79f;
	--card-fantasies-futures: #70cac2;
	--card-line-strong: #a8874f;
	--card-path: #a88a5e;
	--card-muted: #bfae8d;
	--card-slot-border: #77726a;
	--card-faint: #9a8970;
	--card-line: #7f6646;
	--card-band-middle: #2d2114;
	--card-score-line: #7d6a4b;
	--card-loss: #e68e82;
	--card-slot: #4a463f;
	--card-line-soft: #5a4935;
	--card-filled-slot: #544636;
	--card-band-end: #4c3922;
	--card-ink: #14100b;
	--card-control: #342b20;
	--card-title: #e2b857;
	--card-paper: #2b241b;
	--card-raised: #3a3125;
	--card-exploration-text: #8cc3e2;
	--card-science-text: #93cdab;
	--card-technology-text: #e3ab6c;
	--card-military-text: #ec958e;
	--card-condition: #353a3c;
	--card-condition-line: #5f676a;
	--card-condition-text: #e4e7e6;
	--card-note: #cdbb97;
	--card-trap-band-start: #2c0e11;
	--card-trap-band-middle: #511d22;
	--card-trap-band-end: #7d3435;
	--card-trap-line: #b0555a;
	--card-shadow-soft: rgb(0 0 0 / 45%);
	--card-shadow-strong: rgb(0 0 0 / 60%);
	--card-accent: #dcb263;
	--card-art-frame: #0c0906;
	--card-title-shadow: #000000;
	--card-back: #3a2a17;
}
/* Global base styles: the self-hosted fonts, the page and focus. Component styles live in their components. */
@font-face {
	font-family: 'Cinzel';
	src: url('../../static/fonts/cinzel.woff2') format('woff2');
	font-weight: 400 900;
	font-display: swap;
}

@font-face {
	font-family: 'Atkinson Hyperlegible';
	src: url('../../static/fonts/atkinson-hyperlegible-regular.woff2') format('woff2');
	font-weight: 400;
	font-display: swap;
}

@font-face {
	font-family: 'Atkinson Hyperlegible';
	src: url('../../static/fonts/atkinson-hyperlegible-bold.woff2') format('woff2');
	font-weight: 700;
	font-display: swap;
}

* {
	box-sizing: border-box;
	scrollbar-width: none;
}

*::-webkit-scrollbar {
	display: none;
}

body {
	margin: 0;
	min-height: 100vh;
	background: var(--ink);
	color: var(--text);
	font: var(--weight-regular) var(--font-size-base) / var(--leading-snug)
		var(--font-body);
}

button,
input,
select,
textarea {
	font: inherit;
	color: inherit;
}

button {
	cursor: pointer;
}

a {
	color: var(--gold);
}

:focus-visible {
	outline: var(--focus-outline);
	outline-offset: var(--focus-offset);
}

	//#region src/lib/words.js
	/** The minus sign numbers show, as in "hex 2,−1". */
	var MINUS = "−";
	/** Words a title keeps in lower case, unless they come first. */
	var SMALL_WORDS = [
		"of",
		"and",
		"for",
		"the",
		"a",
		"an",
		"on",
		"in"
	];
	/**
	* Each counted thing's name, one and many, in the order amounts are listed: the resources as the player overview
	* lists them, then VP, then tiles and cards.
	*/
	var NOUNS = {
		coin: ["coin", "coins"],
		food: ["food", "food"],
		worker: ["worker", "workers"],
		culture: ["culture", "culture"],
		any: ["resource of your choice", "resources of your choice"],
		different: ["different resource", "different resources"],
		same: ["resource of one type", "resources of the same type"],
		vp: ["VP", "VP"],
		territory: ["territory tile", "territory tiles"],
		space: ["space tile", "space tiles"],
		tapestry: ["tapestry card", "tapestry cards"],
		tech: ["tech card", "tech cards"]
	};
	/** The counted things, in the order amounts are listed. */
	var AMOUNT_ORDER = Object.freeze(Object.keys(NOUNS));
	/**
	* A text with its first letter in upper case.
	* @param {string} text
	* @returns {string}
	*/
	function capitalize(text) {
		return text.charAt(0).toUpperCase() + text.slice(1);
	}
	/**
	* A list in words: "a", "a and b", "a, b and c".
	* @param {readonly string[]} items
	* @param {string} [word] - The last joining word, 'and' or 'or'
	* @returns {string}
	*/
	function joinList(items, word = "and") {
		if (items.length <= 1) return items[0] ?? "";
		return `${items.slice(0, -1).join(", ")} ${word} ${items[items.length - 1]}`;
	}
	/**
	* "a" or "an", for the name that follows.
	* @param {string} name
	* @returns {string}
	*/
	function article(name) {
		return /^[aeiou]/i.test(name) ? "an" : "a";
	}
	/**
	* A whole number as shown, with a real minus sign.
	* @param {number} n
	* @returns {string}
	*/
	function signed(n) {
		return n < 0 ? `${MINUS}${-n}` : String(n);
	}
	/**
	* An id in words: 'the-chosen' or 'theChosen' to 'the chosen'.
	* @param {string} id
	* @returns {string}
	*/
	function wordsOf(id) {
		return id.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/[-_]+/g, " ").toLowerCase().trim();
	}
	/**
	* An id as a name: 'age-of-sail' to 'Age of Sail'.
	* @param {string} id
	* @returns {string}
	*/
	function titleOf(id) {
		return wordsOf(id).split(" ").map((word, i) => i > 0 && SMALL_WORDS.includes(word) ? word : capitalize(word)).join(" ");
	}
	/**
	* A counted thing's noun for an amount: "coin", "coins", "food".
	* @param {string} id - A counted thing (a resource, 'any', 'vp', a tile or card kind), or any other id
	* @param {number} n
	* @returns {string}
	*/
	function nounOf(id, n) {
		const [one, many] = NOUNS[id] ?? [wordsOf(id), wordsOf(id)];
		return n === 1 ? one : many;
	}
	/**
	* An amount of one counted thing, with its plural: "1 coin", "2 coins", "2 food", "2 resources of your choice".
	* @param {string} id - A counted thing (a resource, 'any', 'vp', a tile or card kind), or any other id
	* @param {number} n
	* @returns {string}
	*/
	function amountWords(id, n) {
		return `${n} ${nounOf(id, n)}`;
	}
	/**
	* A name's plural: "Markets", "Armories" after a consonant and y, "Days" after a vowel and y.
	* @param {string} word
	* @returns {string}
	*/
	function pluralOf(word) {
		return /[^aeiou]y$/i.test(word) ? `${word.slice(0, -1)}ies` : `${word}s`;
	}

		each(div_3, 21, () => AUTOMA_CARDS, (card) => card.id, ($$anchor, card) => {
			AutomaDecisionCard($$anchor, { get card() {
				return get(card);
			} });
		});
		reset(div_3);
		reset(section_1);
		reset(main);
		template_effect(() => {
			set_attribute(button, "aria-pressed", get(host));
			set_attribute(button_1, "aria-pressed", !get(host));
			set_text(text, get(status));
		});
		delegated("click", button, () => set(host, true));
		delegated("click", button_1, () => set(host, false));
		delegated("click", button_2, () => set(status, seats.some((s) => s?.kind === "automa") && seats.some((s) => s?.kind === "shadow") ? "Solo table ready." : "Add Automa and Shadow Empire for a solo table.", true));
		append($$anchor, fragment);
		pop();
	}
	delegate(["click"]);
