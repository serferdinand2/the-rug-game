<!doctype html>
<!-- Issue #153: clickable mockup of what other players just did; demo state over the running game's screenshots, not the playable game. -->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>The Rug Game · What other players just did (#153)</title>
	<link rel="stylesheet" href="../../src/styles/tokens.css">
	<style>
		@font-face {
			font-family: 'Cinzel';
			src: url('../../static/fonts/cinzel.woff2') format('woff2');
			font-weight: 400 900;
			font-display: swap;
		}
		@font-face {
			font-family: 'Atkinson Hyperlegible';
			src: url('../../static/fonts/atkinson-hyperlegible-regular.woff2') format('woff2');
			font-weight: 400;
			font-display: swap;
		}
		@font-face {
			font-family: 'Atkinson Hyperlegible';
			src: url('../../static/fonts/atkinson-hyperlegible-bold.woff2') format('woff2');
			font-weight: 700;
			font-display: swap;
		}

		* { box-sizing: border-box; }
		html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); }
		body { min-width: 1920px; min-height: 1080px; overflow: hidden; }

		/* The game screen: a screenshot of the running game (#153 mockup), Mira's screen while Lazar takes his turn. */
		.mk-canvas { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
		.mk-backdrop { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
		.mk-overlay { position: absolute; inset: 0; pointer-events: none; }
		.mk-lit { fill: color-mix(in srgb, var(--rg-who) 16%, transparent); stroke: var(--rg-who); stroke-width: 3; filter: drop-shadow(0 0 6px var(--rg-who)); }
		.mk-lit--pulse { animation: mk-pulse 1.2s var(--ease) 2; }
		@keyframes mk-pulse { 50% { stroke-width: 6; } }
		.mk-piece { position: absolute; width: 30px; height: 30px; }
		.mk-chip-ring { position: absolute; left: 635px; top: 11px; width: 214px; height: 35px; border: 2px solid var(--player-1); box-shadow: 0 0 14px var(--player-1); opacity: 0; pointer-events: none; }
		.mk-chip-ring--on { animation: mk-ring 1.1s var(--ease) 1; }
		@keyframes mk-ring { 20% { opacity: 1; } 100% { opacity: 0; } }

		/* ---------- What a player just did: the body both options share ---------- */
		.rg-player-action { --rg-who: var(--player-1); }
		.rg-player-action--band { display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-5) var(--space-8); border-top: 4px solid var(--rg-who); border-bottom: var(--border) solid var(--line-soft); }
		.rg-player-action--turn { font: italic var(--weight-bold) var(--font-size-xl) / var(--leading-tight) var(--font-body); color: var(--rg-who); }
		.rg-player-action--context { color: var(--muted); font-size: var(--font-size-sm); }
		.rg-player-action--count { margin-left: auto; color: var(--muted); font-size: var(--font-size-sm); font-weight: var(--weight-bold); display: flex; align-items: center; gap: 6px; }
		.rg-player-action--dot { width: 8px; height: 8px; background: var(--line); }
		.rg-player-action--dot-on { background: var(--rg-who); }
		.rg-player-action--body { display: flex; gap: var(--space-9); padding: var(--space-8); align-items: center; }
		.rg-player-action--picture { flex: none; display: grid; justify-items: center; gap: var(--space-5); }
		.rg-player-action--words { width: 340px; display: grid; gap: var(--space-6); }
		.rg-player-action--headline { margin: 0; font-size: var(--font-size-3xl); line-height: var(--leading-snug); font-weight: var(--weight-bold); }
		.rg-player-action--who { color: var(--rg-who); }
		.rg-player-action--name { font-family: var(--font-title); color: var(--gold); font-weight: var(--weight-bold); }
		.rg-player-action--lines { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-3); color: var(--muted); font-size: var(--font-size-base); line-height: var(--leading-snug); }
		.rg-player-action--lines li { padding-left: 14px; position: relative; }
		.rg-player-action--lines li::before { content: ''; position: absolute; left: 0; top: 0.55em; width: 6px; height: 6px; background: var(--rg-who); }
		.rg-player-action--note { margin: 0; color: var(--faint); font-size: var(--font-size-sm); }
		.rg-player-action--foot { display: flex; align-items: center; gap: var(--space-6); padding: 0 var(--space-8) var(--space-6); color: var(--faint); font-size: var(--font-size-xs); }
		.rg-player-action--timer { flex: 1; height: 3px; background: var(--line-soft); overflow: hidden; }
		.rg-player-action--timer i { display: block; height: 100%; background: var(--rg-who); transform-origin: left; animation: mk-timer var(--mk-hold, 5s) linear forwards; }
		.mk-paused .rg-player-action--timer i { animation-play-state: paused; }
		@keyframes mk-timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }

		/* Pictures */
		.mk-card { display: block; filter: drop-shadow(0 12px 18px rgb(0 0 0 / 45%)); }
		.mk-card--tapestry { width: 319px; height: 560px; }
		.mk-card--tech { width: 425px; height: 298px; }
		.mk-card--small { width: 160px; height: 281px; }
		.mk-back { width: 319px; height: 560px; display: grid; place-items: center; align-content: center; gap: var(--space-8); background: linear-gradient(160deg, #7a5326, #5b3a19); border: 6px solid #3b2611; box-shadow: inset 0 0 0 2px #a77a3d, 0 12px 18px rgb(0 0 0 / 45%); color: #f0d9a8; text-align: center; }
		.mk-back img { width: 120px; height: 120px; image-rendering: pixelated; }
		.mk-back b { font-family: var(--font-title); font-size: var(--font-size-2xl); letter-spacing: var(--letter-spacing-title); }
		.mk-back span { font-size: var(--font-size-sm); color: #d9bf8c; }
		.mk-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: var(--border) solid var(--line); background: var(--control); font-size: var(--font-size-sm); }
		.mk-tag img { width: 24px; height: 24px; }
		.mk-tag b { font-family: var(--font-title); color: var(--rg-track, var(--gold)); font-size: var(--font-size-md); }
		.mk-space { display: grid; justify-items: center; gap: var(--space-5); }
		.mk-space--landmark { width: 220px; height: 220px; display: grid; place-items: center; background: color-mix(in srgb, var(--raised) 70%, transparent); border: var(--border) solid var(--line-soft); }
		.mk-space--landmark img { width: 180px; height: 180px; image-rendering: pixelated; }
		.mk-space--caption { font-family: var(--font-title); color: var(--gold); font-size: var(--font-size-lg); }
		.mk-hex { width: 232px; height: 201px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background-repeat: no-repeat; position: relative; }
		.mk-hex .mk-piece { width: 40px; height: 40px; }
		.mk-dice { display: flex; gap: var(--space-5); }
		.mk-die { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
		.mk-die img { position: absolute; inset: 0; width: 64px; height: 64px; }
		.mk-die b { position: relative; color: #fff; font-size: var(--font-size-sm); text-shadow: 0 1px 0 #000; }
		.mk-die img.mk-die--face { position: relative; inset: auto; width: 26px; height: 26px; }
		.mk-income-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-4); }
		.mk-income-steps li { display: grid; grid-template-columns: 74px 1fr; gap: var(--space-4); align-items: baseline; font-size: var(--font-size-base); }
		.mk-income-steps em { font-style: normal; color: var(--gold); font-size: var(--font-size-xs); text-transform: uppercase; letter-spacing: var(--letter-spacing-caps); font-weight: var(--weight-bold); }
		.mk-res { display: flex; gap: var(--space-5); margin-top: var(--space-3); }
		.mk-res span { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--raised); font-weight: var(--weight-bold); }
		.mk-res img { width: 24px; height: 24px; }

		/* ---------- Option A: a panel at the centre of the tracks, like the prompts and the dice tray ---------- */
		.rg-player-action--centre { position: absolute; left: 721px; top: 540px; transform: translate(-50%, -50%); background: var(--float-surface); border: var(--border) solid var(--line); box-shadow: var(--shadow-float); cursor: pointer; animation: mk-in var(--duration-medium) var(--ease-out); }
		.rg-player-action--docked { left: auto; right: calc(1920px - 1418px + 8px); top: 120px; transform: none; }
		.rg-player-action--docked .rg-player-action--body { flex-direction: column; align-items: stretch; }
		.rg-player-action--docked .rg-player-action--picture { justify-self: center; }
		.rg-player-action--docked .rg-player-action--words { width: 380px; }
		.rg-player-action--income .rg-player-action--band { background: linear-gradient(color-mix(in srgb, var(--gold) 30%, var(--chrome)), color-mix(in srgb, var(--gold) 8%, var(--chrome))); }
		.rg-player-action--leaving { animation: mk-settle var(--duration-slow) var(--ease) forwards; }
		@keyframes mk-in { from { opacity: 0; transform: translate(-50%, -46%); } }
		.rg-player-action--docked.rg-player-action--centre { animation-name: mk-in-docked; }
		@keyframes mk-in-docked { from { opacity: 0; transform: translateY(12px); } }
		@keyframes mk-settle { to { opacity: 0; left: 742px; top: 28px; transform: translate(-50%, -50%) scale(0.08); } }

		/* ---------- Option B: a strip above the footer that opens on a click ---------- */
		.rg-player-action--strip { position: absolute; left: 721px; bottom: calc(1080px - 1022px + 14px); transform: translateX(-50%); min-width: 620px; background: var(--float-surface); border: var(--border) solid var(--line); box-shadow: var(--shadow-float); cursor: pointer; animation: mk-up var(--duration-medium) var(--ease-out); }
		@keyframes mk-up { from { opacity: 0; transform: translate(-50%, 16px); } }
		.rg-player-action--row { display: flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-6) var(--space-4) 0; border-left: 6px solid var(--rg-who); }
		.rg-player-action--thumb { width: 48px; height: 48px; margin-left: var(--space-5); flex: none; display: grid; place-items: center; background: var(--raised); overflow: hidden; }
		.rg-player-action--thumb img { width: 48px; height: 48px; object-fit: cover; image-rendering: pixelated; }
		.rg-player-action--thumb .mk-hex { flex: none; }
		.rg-player-action--line { font-size: var(--font-size-lg); font-weight: var(--weight-bold); white-space: nowrap; }
		.rg-player-action--more { margin-left: auto; display: flex; align-items: center; gap: var(--space-5); color: var(--muted); font-size: var(--font-size-sm); white-space: nowrap; }
		.rg-player-action--chev { color: var(--gold); font-weight: var(--weight-bold); }
		.rg-player-action--strip .rg-player-action--timer { height: 3px; flex: none; }
		.rg-player-action--sheet { border-bottom: var(--border) solid var(--line-soft); animation: mk-sheet var(--duration-medium) var(--ease-out); }
		@keyframes mk-sheet { from { opacity: 0; } }
		.rg-player-action--strip.rg-player-action--leaving { animation: mk-sink var(--duration-medium) var(--ease) forwards; }
		@keyframes mk-sink { to { opacity: 0; transform: translate(-50%, 40px); } }

		/* ---------- The footer, once the actions have settled ---------- */
		.mk-footer { position: absolute; left: 0; top: 1023px; width: 1440px; height: 57px; background: var(--chrome); display: flex; align-items: center; gap: 12px; padding-left: 24px; }
		.mk-footer--turn { font: italic var(--weight-bold) var(--font-size-xl) / 1 var(--font-body); color: var(--player-1); }
		.mk-footer--text { font-weight: var(--weight-bold); font-size: var(--font-size-md); }
		.mk-footer--last { color: var(--muted); font-size: var(--font-size-md); }
		.mk-footer--last b { color: var(--text); }
		.mk-footer--again { margin-left: 4px; padding: 5px 10px; border: var(--border) solid var(--line); background: var(--control); color: var(--text); font: inherit; font-size: var(--font-size-sm); cursor: pointer; }
		.mk-footer--again:hover { border-color: var(--gold); }

		/* ---------- The mockup's own controls, not part of the design ---------- */
		.mk-dock { position: absolute; right: 6px; bottom: 4px; width: 470px; display: grid; gap: 4px; padding: 4px 6px; border: 1px dashed var(--bronze); background: color-mix(in srgb, var(--ink) 92%, transparent); font-size: 11px; z-index: 10; }
		.mk-dock--row { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; }
		.mk-dock b { color: var(--bronze); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; margin-right: 2px; }
		.mk-dock button { padding: 3px 6px; border: 1px solid var(--line); background: var(--control); color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
		.mk-dock button[aria-pressed='true'] { border-color: var(--gold); color: var(--gold); background: var(--picked-fill); }
		.mk-dock button:hover { border-color: var(--gold); }
		.mk-clean .mk-dock { display: none; }

		@media (prefers-reduced-motion: reduce) {
			.rg-player-action--centre, .rg-player-action--strip, .rg-player-action--sheet, .mk-lit--pulse { animation: none; }
			.rg-player-action--leaving { animation: mk-fade var(--duration-fast) linear forwards !important; }
			.rg-player-action--timer i { animation: none; }
			@keyframes mk-fade { to { opacity: 0; } }
		}
	</style>
</head>
<body>
	<div class="mk-canvas" id="canvas">
		<img class="mk-backdrop" id="backdrop" src="assets/issue-153/backdrop-tracks.png" alt="Mira's screen while Lazar takes his turn">
		<svg class="mk-overlay" id="lit" width="1920" height="1080" viewBox="0 0 1920 1080" style="--rg-who: var(--player-1)"></svg>
		<div class="mk-overlay" id="pieces"></div>
		<div class="mk-chip-ring" id="ring"></div>
		<div id="footer"></div>
		<div id="stage"></div>
		<div class="mk-dock" id="dock">
			<div class="mk-dock--row">
				<b>Mockup</b>
				<button data-option="a" title="Option A: a panel at the tracks' centre (key A)">A · Centre</button>
				<button data-option="b" title="Option B: a strip above the footer that opens on a click (key B)">B · Strip</button>
				<button data-queue="turn" title="Lazar's turn: an advance that gains the Lighthouse, then the explore it gives (key Space)">▶ Advance turn</button>
				<button data-queue="income" title="Lazar's income turn: his tapestry card, then the rest of the turn (key I)">▶ Income turn</button>
				<button data-settle title="What stays once the actions have settled (key S)">Settled</button>
			</div>
			<div class="mk-dock--row">
				<button data-one="tapestry" title="Key 1">Tapestry</button>
				<button data-one="facedown" title="Key 2">Face down</button>
				<button data-one="advance" title="Key 3">Advance</button>
				<button data-one="invent" title="Key 4">Invent</button>
				<button data-one="upgrade" title="Key 5">Upgrade</button>
				<button data-one="explore" title="Key 6">Explore</button>
				<button data-one="conquer" title="Key 7">Conquer</button>
				<button data-one="income" title="Key 8">Income</button>
			</div>
		</div>
	</div>

	<script>
		// The mockup's data: Lazar (seat 1, blue) acts while Mira watches. Every sentence is the table log's (src/lib/log.js).
		const ART = '../../static/art/';
		const ASSETS = 'assets/issue-153/';
		const BACKDROPS = { tracks: 'backdrop-tracks.png', advanced: 'backdrop-tracks-advanced.png', map: 'backdrop-map.png' };
		// Hexes on the map screenshot, from the running game's geometry.
		const HEXES = {
			'-2_-1': { x: 760, y: 331.1, w: 155, h: 134.2 },
			'-3_-2': { x: 760, y: 196.9, w: 155, h: 134.2 },
		};
		// Navigation, exploration space 4, on the tracks screenshot.
		const NAVIGATION = { x: 371.6, y: 162, w: 116.2, h: 145.25, tip: 16 };
		const WHO = 'Lazar';

		/** A hex of the map, cut from the map screenshot. */
		function hexPicture(key, extra = '', size = 232) {
			const hex = HEXES[key];
			const scale = size / hex.w;
			return `<div class="mk-hex" style="width:${size}px;height:${size * hex.h / hex.w}px;background-image:url(${ASSETS}${BACKDROPS.map});background-size:${1920 * scale}px ${1080 * scale}px;background-position:${-hex.x * scale}px ${-hex.y * scale}px">${extra}</div>`;
		}
		const toppled = (left, top) => `<img class="mk-piece" src="${ART}piece/outpost-toppled-red.svg" alt="" style="left:${left}px;top:${top}px">`;
		const die = (body, words, face) => `<span class="mk-die"><img src="${ART}die/${body}-body.svg" alt="">${face ? `<img class="mk-die--face" src="${ART}resource-24/${face}.svg" alt="">` : `<b>${words}</b>`}</span>`;
		const who = `<span class="rg-player-action--who">${WHO}</span>`;
		const name = (text) => `<span class="rg-player-action--name">${text}</span>`;

		const ACTIONS = {
			tapestry: {
				backdrop: 'tracks', context: 'Income turn 4',
				headline: `${who} played ${name('Industrialism')}`,
				strip: `${who} played ${name('Industrialism')}`,
				thumb: `<img src="${ART}tapestry/industrialism.svg" alt="">`,
				picture: `<img class="mk-card mk-card--tapestry" src="${ASSETS}tapestry-industrialism.png" alt="Industrialism">`,
				lines: ["Lazar's Industrialism took effect for this era."],
				note: 'It is now on top of his era IV slot, in his Eras tab.',
			},
			facedown: {
				backdrop: 'tracks', context: 'Income turn 4',
				headline: `${who} played a tapestry card face down`,
				strip: `${who} played a tapestry card face down`,
				thumb: `<img src="${ART}symbol/tapestry-card.svg" alt="">`,
				picture: `<div class="mk-back"><img src="${ART}symbol/tapestry-card.svg" alt=""><b>Tapestry</b><span>Face down</span></div>`,
				lines: [],
				note: 'Its face stays hidden, as on the table.',
			},
			advance: {
				backdrop: 'advanced', lit: 'space', context: 'Advance',
				headline: `${who} advanced to ${name('Navigation')} on <span style="color:var(--exploration);font-family:var(--font-title)">Exploration</span>`,
				strip: `${who} advanced to ${name('Navigation')} and gained the ${name('Lighthouse')}`,
				thumb: `<img src="${ART}landmark/lighthouse.svg" alt="">`,
				picture: `<div class="mk-space"><span class="mk-tag" style="--rg-track:var(--exploration)"><img src="${ART}track/exploration.svg" alt=""><b>Navigation</b> · space 4</span><div class="mk-space--landmark"><img src="${ART}landmark/lighthouse.svg" alt=""></div><span class="mk-space--caption">Lighthouse</span></div>`,
				lines: ['Lazar gained the Lighthouse.', 'Lazar gained territory tile 23.'],
				note: 'The space is lit on the board until this closes.',
			},
			invent: {
				backdrop: 'tracks', context: 'Advance',
				headline: `${who} invented ${name('Printing Press')}`,
				strip: `${who} invented ${name('Printing Press')}`,
				thumb: `<img src="${ART}tech/printing-press.svg" alt="">`,
				picture: `<img class="mk-card mk-card--tech" src="${ASSETS}tech-printing-press.png" alt="Printing Press">`,
				lines: [],
				note: 'It goes into the bottom row of his Tech tab.',
			},
			upgrade: {
				backdrop: 'tracks', context: 'Advance',
				headline: `${who} upgraded ${name('Compass')} to the top row`,
				strip: `${who} upgraded ${name('Compass')} to the top row`,
				thumb: `<img src="${ART}tech/compass.svg" alt="">`,
				picture: `<img class="mk-card mk-card--tech" src="${ASSETS}tech-compass.png" alt="Compass"><span class="mk-tag">Middle row → <b style="font-family:var(--font-body)">Top row</b></span>`,
				lines: [],
				note: 'Its square benefit follows as its own action.',
			},
			explore: {
				backdrop: 'map', lit: 'explore', docked: true, context: 'Advance',
				headline: `${who} explored hex −2,−1, matching 2 sides`,
				strip: `${who} explored hex −2,−1, matching 2 sides`,
				thumb: hexPicture('-2_-1', '', 54),
				picture: hexPicture('-2_-1'),
				lines: ['Lazar scored 2 VP on the map.'],
				note: 'The board shows the World Map while this is open, then returns to the tracks.',
			},
			conquer: {
				backdrop: 'map', lit: 'conquer', docked: true, context: 'Advance',
				headline: `${who} conquered hex −3,−2`,
				strip: `${who} conquered hex −3,−2 and toppled Mira's outpost`,
				thumb: hexPicture('-3_-2', '', 54),
				picture: `${hexPicture('-3_-2', toppled(126, 96))}<div class="mk-dice">${die('red', '5 VP')}${die('black', '', 'culture')}</div>`,
				lines: ['Lazar rolled the conquer dice: red 5 VP, black 1 culture.', "Mira's outpost on hex −3,−2 was toppled by Lazar.", 'Lazar scored 5 VP on the map.', 'Lazar gained 1 culture.'],
				note: 'The dice tray (#61) rolls first; this follows it.',
			},
			income: {
				backdrop: 'tracks', income: true, context: 'Income turn 4',
				headline: `${who} took income turn 4`,
				strip: `${who} took income turn 4: 12 VP and 9 resources`,
				thumb: `<img src="${ART}resource-48/coin.svg" alt="">`,
				picture: `<img class="mk-card mk-card--small" src="${ASSETS}tapestry-industrialism.png" alt="Industrialism">`,
				custom: `<ul class="mk-income-steps">
					<li><em>Tapestry</em><span>Lazar played ${name('Industrialism')}.</span></li>
					<li><em>Upgrade</em><span>Lazar upgraded ${name('Compass')} to the top row.</span></li>
					<li><em>Score</em><span>Lazar scored 12 VP in their income turn.</span></li>
					<li><em>Income</em><span>Lazar gained 3 coin, 2 worker, 3 food and 1 culture.
						<span class="mk-res"><span><img src="${ART}resource-24/coin.svg" alt="">3</span><span><img src="${ART}resource-24/worker.svg" alt="">2</span><span><img src="${ART}resource-24/food.svg" alt="">3</span><span><img src="${ART}resource-24/culture.svg" alt="">1</span></span></span></li>
				</ul>`,
				lines: [],
				note: 'Era IV begins for Lazar.',
			},
		};
		const QUEUES = { turn: ['advance', 'explore'], income: ['tapestry', 'income'] };

		const params = new URLSearchParams(location.search);
		const state = {
			option: params.get('option') === 'b' ? 'b' : 'a',
			queue: ['tapestry'],
			index: 0,
			expanded: params.has('expanded'),
			settled: false,
			paused: params.has('clean'),
			last: 'tapestry',
		};
		if (params.has('clean')) {
			document.body.classList.add('mk-clean');
		}
		if (params.get('queue') && QUEUES[params.get('queue')]) {
			state.queue = QUEUES[params.get('queue')];
			state.index = Number(params.get('index') || 0);
		} else if (params.get('state') && ACTIONS[params.get('state')]) {
			state.queue = [params.get('state')];
		}
		if (params.has('settled')) {
			state.settled = true;
			state.last = state.queue[state.queue.length - 1];
		}

		const stage = document.getElementById('stage');
		const backdrop = document.getElementById('backdrop');
		const lit = document.getElementById('lit');
		const pieces = document.getElementById('pieces');
		const footer = document.getElementById('footer');
		const ring = document.getElementById('ring');
		let timer = 0;
		const HOLD = 5000;

		function current() {
			return state.settled ? null : ACTIONS[state.queue[state.index]];
		}

		function band(action) {
			const total = state.queue.length;
			const dots = total > 1 ? state.queue.map((_, i) => `<i class="rg-player-action--dot ${i === state.index ? 'rg-player-action--dot-on' : ''}"></i>`).join('') + ` ${state.index + 1} of ${total}` : '';
			return `<div class="rg-player-action--band"><span class="rg-player-action--turn">${WHO}'s turn</span><span class="rg-player-action--context">· Leaders · ${action.context}</span><span class="rg-player-action--count">${dots}</span></div>`;
		}

		function body(action) {
			const lines = action.lines.length ? `<ul class="rg-player-action--lines">${action.lines.map((l) => `<li>${l}</li>`).join('')}</ul>` : '';
			return `<div class="rg-player-action--body"><div class="rg-player-action--picture">${action.picture}</div><div class="rg-player-action--words"><p class="rg-player-action--headline">${action.headline}</p>${action.custom ?? ''}${lines}${action.note ? `<p class="rg-player-action--note">${action.note}</p>` : ''}</div></div>`;
		}

		function foot(text) {
			return `<div class="rg-player-action--foot"><span class="rg-player-action--timer"><i style="--mk-hold:${HOLD}ms"></i></span><span>${text}</span></div>`;
		}

		function renderBoard(action) {
			const name = action ? action.backdrop : state.last && ACTIONS[state.last].backdrop === 'map' ? 'advanced' : ACTIONS[state.last]?.backdrop ?? 'tracks';
			backdrop.src = ASSETS + BACKDROPS[name];
			lit.innerHTML = '';
			pieces.innerHTML = '';
			const kind = action?.lit;
			if (kind === 'space') {
				const s = NAVIGATION;
				const points = [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w + s.tip, s.y + s.h / 2], [s.x + s.w, s.y + s.h], [s.x, s.y + s.h], [s.x + s.tip, s.y + s.h / 2]];
				lit.innerHTML = `<polygon class="mk-lit mk-lit--pulse" points="${points.map((p) => p.join(',')).join(' ')}"/>`;
			}
			if (kind === 'explore' || kind === 'conquer') {
				const h = HEXES[kind === 'explore' ? '-2_-1' : '-3_-2'];
				const points = [[h.x + h.w / 4, h.y], [h.x + (3 * h.w) / 4, h.y], [h.x + h.w, h.y + h.h / 2], [h.x + (3 * h.w) / 4, h.y + h.h], [h.x + h.w / 4, h.y + h.h], [h.x, h.y + h.h / 2]];
				lit.innerHTML = `<polygon class="mk-lit mk-lit--pulse" points="${points.map((p) => p.join(',')).join(' ')}"/>`;
			}
			if (kind === 'conquer' || (name === 'map' && state.last === 'conquer')) {
				pieces.innerHTML = toppled(845, 252);
			}
		}

		function renderFooter() {
			if (!state.settled) {
				footer.innerHTML = '';
				return;
			}
			const action = ACTIONS[state.last];
			footer.innerHTML = `<div class="mk-footer"><span class="mk-footer--turn">${WHO}'s turn</span><span class="mk-footer--text">${WHO} is taking their turn.</span><span class="mk-footer--last">· Just now: <b>${action.strip.replace(/<[^>]+>/g, '')}.</b></span><button class="mk-footer--again" id="again" title="Show what Lazar did this turn again">Show again</button></div>`;
			document.getElementById('again').onclick = () => {
				state.settled = false;
				state.index = 0;
				render();
			};
		}

		function render() {
			clearTimeout(timer);
			const action = current();
			renderBoard(action);
			renderFooter();
			document.querySelectorAll('[data-option]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.option === state.option)));
			document.querySelectorAll('[data-one]').forEach((b) => b.setAttribute('aria-pressed', String(state.queue.length === 1 && state.queue[0] === b.dataset.one && !state.settled)));
			document.querySelectorAll('[data-queue]').forEach((b) => b.setAttribute('aria-pressed', String(QUEUES[b.dataset.queue] === state.queue && !state.settled)));
			document.querySelector('[data-settle]').setAttribute('aria-pressed', String(state.settled));
			if (!action) {
				stage.innerHTML = '';
				return;
			}
			const last = state.index === state.queue.length - 1;
			const classes = ['rg-player-action', action.income ? 'rg-player-action--income' : '', state.paused ? 'mk-paused' : ''];
			if (state.option === 'a') {
				classes.push('rg-player-action--centre', action.docked ? 'rg-player-action--docked' : '');
				stage.innerHTML = `<div class="${classes.join(' ')}" id="shown">${band(action)}${body(action)}${foot(last ? 'Click or Esc to close' : 'Click for the next · Esc to skip them all')}</div>`;
			} else {
				classes.push('rg-player-action--strip');
				const total = state.queue.length;
				const count = total > 1 ? `<span>${state.index + 1} of ${total}</span>` : '';
				const sheet = state.expanded ? `<div class="rg-player-action--sheet">${band(action)}${body(action)}</div>` : '';
				stage.innerHTML = `<div class="${classes.join(' ')}" id="shown">${sheet}<div class="rg-player-action--row"><span class="rg-player-action--thumb">${action.thumb}</span><span class="rg-player-action--line">${action.strip}</span><span class="rg-player-action--more">${count}<span class="rg-player-action--chev">${state.expanded ? 'Hide ▾' : 'Show ▴'}</span></span></div><span class="rg-player-action--timer" style="display:block"><i style="--mk-hold:${state.expanded ? 3600000 : HOLD}ms"></i></span></div>`;
			}
			const shown = document.getElementById('shown');
			shown.addEventListener('click', clickHandler);
			shown.addEventListener('mouseenter', () => { clearTimeout(timer); shown.classList.add('mk-paused'); });
			shown.addEventListener('mouseleave', () => { shown.classList.remove('mk-paused'); schedule(); });
			schedule();
		}

		function schedule() {
			clearTimeout(timer);
			if (state.paused || state.expanded) {
				return;
			}
			timer = setTimeout(next, HOLD);
		}

		function next() {
			if (state.index < state.queue.length - 1) {
				state.index++;
				render();
				return;
			}
			settle();
		}

		function settle() {
			clearTimeout(timer);
			const shown = document.getElementById('shown');
			state.last = state.queue[state.queue.length - 1];
			if (!shown) {
				state.settled = true;
				render();
				return;
			}
			shown.classList.add('rg-player-action--leaving');
			ring.classList.remove('mk-chip-ring--on');
			void ring.offsetWidth;
			ring.classList.add('mk-chip-ring--on');
			setTimeout(() => {
				state.settled = true;
				state.expanded = false;
				render();
			}, 450);
		}

		function clickHandler() {
			if (state.option === 'b') {
				state.expanded = !state.expanded;
				render();
				return;
			}
			next();
		}

		function play(queue) {
			state.queue = queue;
			state.index = 0;
			state.settled = false;
			state.expanded = false;
			state.paused = false;
			document.body.classList.remove('mk-clean');
			render();
		}

		document.querySelectorAll('[data-option]').forEach((b) => (b.onclick = () => { state.option = b.dataset.option; state.expanded = false; render(); }));
		document.querySelectorAll('[data-one]').forEach((b) => (b.onclick = () => play([b.dataset.one])));
		document.querySelectorAll('[data-queue]').forEach((b) => (b.onclick = () => play(QUEUES[b.dataset.queue])));
		document.querySelector('[data-settle]').onclick = () => { state.last = state.queue[state.queue.length - 1]; state.settled = true; render(); };

		document.addEventListener('keydown', (event) => {
			const keys = Object.keys(ACTIONS);
			if (event.key === 'Escape') {
				if (!state.settled) settle();
			} else if (/^[1-8]$/.test(event.key)) {
				play([keys[Number(event.key) - 1]]);
			} else if (event.key === 'a' || event.key === 'b') {
				state.option = event.key;
				state.expanded = false;
				render();
			} else if (event.key === ' ') {
				event.preventDefault();
				play(QUEUES.turn);
			} else if (event.key === 'i') {
				play(QUEUES.income);
			} else if (event.key === 's') {
				document.querySelector('[data-settle]').click();
			}
		});

		render();
	</script>
</body>
</html>
