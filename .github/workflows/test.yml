name: Tests
on: [push, pull_request]
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        # The simulation's watchdog fails a stuck game within a minute; this stops anything else that hangs.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm test
